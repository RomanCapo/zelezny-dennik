.upd{position:fixed;left:50%;transform:translateX(-50%);top:calc(12px + env(safe-area-inset-top,0px));z-index:95;display:flex;align-items:center;gap:12px;background:var(--blue);color:#fff;padding:10px 12px 10px 16px;border-radius:12px;font-weight:700;box-shadow:0 10px 30px #0006;max-width:calc(100% - 32px)}

<body>
<title>Železný denník</title>
<style>
@font-face{font-family:"Big Shoulders Display";src:url(fonts/bigshoulders.woff) format("woff");font-weight:100 900;font-display:swap}
@font-face{font-family:"Figtree";src:url(fonts/figtree.woff) format("woff");font-weight:300 900;font-display:swap}
/* Layout: one phone-width column, bottom tab bar, the live workout as a full-height sheet. Colors borrow from competition bumper plates. */
:root{
  --bg:#f2f3f0; --surface:#ffffff; --surface2:#e8eae6; --line:#d6d9d4;
  --fg:#16191c; --muted:#646b70;
  --blue:#1f5fd1; --blue-ink:#ffffff; --red:#d32f35; --yellow:#c99a00; --green:#178a54;
  --blue-soft:#1f5fd11c; --red-soft:#d32f3518; --green-soft:#178a5418; --yellow-soft:#c99a0020;
  --shadow:0 8px 30px #10141a1f;
  --display:"Big Shoulders Display","Arial Narrow",Impact,sans-serif;
  --body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#111315; --surface:#1a1d20; --surface2:#23272b; --line:#30353a;
  --fg:#eceee8; --muted:#8e959b;
  --blue:#4c86f0; --blue-ink:#ffffff; --red:#f0545a; --yellow:#f2c230; --green:#36c17f;
  --blue-soft:#4c86f022; --red-soft:#f0545a22; --green-soft:#36c17f20; --yellow-soft:#f2c23022;
  --shadow:0 10px 34px #0008; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111315; --surface:#1a1d20; --surface2:#23272b; --line:#30353a;
  --fg:#eceee8; --muted:#8e959b;
  --blue:#4c86f0; --blue-ink:#ffffff; --red:#f0545a; --yellow:#f2c230; --green:#36c17f;
  --blue-soft:#4c86f022; --red-soft:#f0545a22; --green-soft:#36c17f20; --yellow-soft:#f2c23022;
  --shadow:0 10px 34px #0008; color-scheme:dark}
:root[data-app-theme="dark"]{
  --bg:#111315; --surface:#1a1d20; --surface2:#23272b; --line:#30353a;
  --fg:#eceee8; --muted:#8e959b;
  --blue:#4c86f0; --blue-ink:#ffffff; --red:#f0545a; --yellow:#f2c230; --green:#36c17f;
  --blue-soft:#4c86f022; --red-soft:#f0545a22; --green-soft:#36c17f20; --yellow-soft:#f2c23022;
  --shadow:0 10px 34px #0008; color-scheme:dark}
:root[data-app-theme="light"]{  --bg:#f2f3f0; --surface:#ffffff; --surface2:#e8eae6; --line:#d6d9d4;
  --fg:#16191c; --muted:#646b70;
  --blue:#1f5fd1; --blue-ink:#ffffff; --red:#d32f35; --yellow:#c99a00; --green:#178a54;
  --blue-soft:#1f5fd11c; --red-soft:#d32f3518; --green-soft:#178a5418; --yellow-soft:#c99a0020;
  --shadow:0 8px 30px #10141a1f;
  color-scheme:light}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%;overscroll-behavior:none}
body{overscroll-behavior:none}
html,body,button,a,input,select,textarea,label{touch-action:manipulation}
button,nav,.chip,.excard,.pill,.eyebrow,h1,h2,h3,.brand,.stat,.wx-top,.sets th{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
input,select,textarea{font-size:16px!important}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font:15px/1.45 var(--body);-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
.app{max-width:760px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 calc(150px + env(safe-area-inset-bottom,0px))}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:14px 10px}
.brand{font-family:var(--display);font-weight:900;font-size:28px;letter-spacing:.01em;text-transform:uppercase;line-height:1;display:flex;align-items:center;gap:10px}
.plate-mark{display:flex;gap:2px;align-items:center}
.plate-mark i{display:block;width:5px;border-radius:2px}
.plate-mark i:nth-child(1){height:22px;background:var(--red)}.plate-mark i:nth-child(2){height:20px;background:var(--blue)}.plate-mark i:nth-child(3){height:16px;background:var(--yellow)}.plate-mark i:nth-child(4){height:12px;background:var(--green)}
.sync{font-size:12px;color:var(--muted);white-space:nowrap}
h1,h2,h3{font-family:var(--display);text-transform:uppercase;letter-spacing:.01em;margin:0;text-wrap:balance}
h1{font-size:40px;font-weight:900;line-height:.95}
h2{font-size:22px;font-weight:800;line-height:1.05}
h3{font-size:18px;font-weight:800}
.eyebrow{font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.muted{color:var(--muted)}
.stack{display:flex;flex-direction:column;gap:12px}
.section{display:flex;flex-direction:column;gap:12px;margin-top:26px}
.row{display:flex;align-items:center;gap:10px}
.between{justify-content:space-between}
.wrap{flex-wrap:wrap}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px}
.btn{border:0;border-radius:11px;padding:11px 16px;font-weight:700;background:var(--surface2);display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px}
.btn.primary{background:var(--blue);color:var(--blue-ink)}
.btn.danger{background:var(--red-soft);color:var(--red)}
.btn.ghost{background:transparent;border:1px solid var(--line)}
.btn.sm{min-height:34px;padding:6px 12px;font-size:13px;border-radius:9px}
.btn.block{width:100%}
.btn:disabled{opacity:.45;cursor:default}
.icon-btn{border:0;background:transparent;width:40px;height:40px;border-radius:10px;display:grid;place-items:center;color:var(--muted)}
.icon-btn:hover{background:var(--surface2);color:var(--fg)}
svg.i{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

/* hero / stats */
.hero{display:grid;grid-template-columns:1fr auto;gap:14px;align-items:end;margin-top:6px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;min-width:0}
.stat b{display:block;font-family:var(--display);font-size:30px;font-weight:800;line-height:1;font-variant-numeric:tabular-nums}
.stat span{font-size:12px;color:var(--muted)}
.heat{display:grid;grid-template-rows:repeat(7,1fr);grid-auto-flow:column;gap:3px;overflow-x:auto}
.heat i{width:14px;height:14px;border-radius:3px;background:var(--surface2);display:block}
.heat i.on{background:var(--blue)}
.heat i.pr{background:var(--red)}
.heat i.today{outline:1.5px solid var(--fg);outline-offset:-1.5px}
.bars{display:flex;flex-direction:column;gap:7px}
.bar{display:grid;grid-template-columns:110px 1fr 28px;gap:10px;align-items:center;font-size:13px}
.bar .track{height:10px;border-radius:5px;background:var(--surface2);overflow:hidden}
.bar .fill{height:100%;background:var(--yellow);border-radius:5px}

/* lists */
.list{display:flex;flex-direction:column;gap:8px}
.tpl{display:flex;flex-direction:column;gap:10px}
.tpl-ex{font-size:13px;color:var(--muted);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:700;padding:3px 9px;border-radius:999px;background:var(--surface2);white-space:nowrap}
.pill.pr{background:var(--red-soft);color:var(--red)}
.pill.ok{background:var(--green-soft);color:var(--green)}
.pill.blue{background:var(--blue-soft);color:var(--blue)}
.pill.yel{background:var(--yellow-soft);color:var(--yellow)}
.prrow{display:grid;grid-template-columns:60px 1fr auto;gap:12px;align-items:center}
.thumb{width:60px;height:40px;border-radius:9px;background-color:var(--surface2);background-repeat:no-repeat;display:block;flex:none}
.thumb.lg{width:64px;height:64px;border-radius:11px}

/* library */
.search{display:flex;gap:8px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:0 12px;min-height:46px}
.search input{border:0;background:transparent;outline:0;flex:1;min-width:0;height:44px}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:13px;font-weight:600;white-space:nowrap}
.chip.on{background:var(--fg);color:var(--bg);border-color:var(--fg)}
select.sel{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 10px;min-height:38px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px}
.excard{background:var(--surface);border:1px solid var(--line);border-radius:13px;overflow:hidden;text-align:left;padding:0;display:flex;flex-direction:column;position:relative}
.excard .ph{aspect-ratio:3/2;background-color:var(--surface2);background-repeat:no-repeat;width:100%;max-width:100%;display:block}
.excard .tx{padding:9px 10px 11px;display:flex;flex-direction:column;gap:2px;min-width:0}
.excard .nm{font-weight:700;font-size:14px;line-height:1.25}
.excard .mu{font-size:12px;color:var(--muted)}
.excard.sel{outline:3px solid var(--blue);outline-offset:-3px}
.excard .tick{position:absolute;top:8px;right:8px;width:26px;height:26px;border-radius:50%;background:var(--blue);color:#fff;display:grid;place-items:center;font-weight:800}
.prtag{position:absolute;top:8px;left:8px;background:var(--red)!important;color:#fff!important}

/* sheet */
.overlay{position:fixed;inset:0;z-index:50;background:#0007;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:760px;max-height:94%;border-radius:20px 20px 0 0;overflow:auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 calc(24px + env(safe-area-inset-bottom,0px));box-shadow:var(--shadow)}
.sheet.full{height:100%;max-height:100%;border-radius:0;padding-top:env(safe-area-inset-top,0px)}
#wo{padding-bottom:calc(110px + env(safe-area-inset-bottom,0px))}
.sheet-head{position:sticky;top:0;z-index:5;background:var(--bg);display:flex;align-items:center;justify-content:space-between;gap:10px;padding-block:12px}
.anim{position:relative;aspect-ratio:3/2;max-width:100%;border-radius:14px;overflow:hidden;background:#fff}
.anim>span.a,.anim>span.b{position:absolute;inset:0;background-repeat:no-repeat;transition:opacity .35s ease}
.anim>span.b{opacity:0}
.anim.flip>span.b{opacity:1}
.anim .lbl{position:absolute;left:10px;bottom:10px;background:#000a;color:#fff;font-size:11px;font-weight:700;padding:3px 8px;border-radius:6px;letter-spacing:.06em}
@media (prefers-reduced-motion:reduce){.anim>span{transition:none}}
ol.steps{margin:0;padding-left:22px;display:flex;flex-direction:column;gap:8px;max-width:65ch}
.kv{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.kv .card{padding:12px}
.kv b{display:block;font-family:var(--display);font-size:26px;font-weight:800;line-height:1.05}
.kv small{color:var(--muted);font-size:12px}
.kv .card.hl{border-color:var(--red)}
.chart{width:100%;height:auto;display:block}

/* workout */
.wo-head{display:flex;flex-direction:column;gap:6px}
.clock{font-family:var(--display);font-weight:800;font-size:22px;font-variant-numeric:tabular-nums}
.wx{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px;display:flex;flex-direction:column;gap:10px}
.wx-top{display:grid;grid-template-columns:64px 1fr auto;gap:12px;align-items:center}
.wx-name{font-weight:800;font-size:16px;line-height:1.2;background:none;border:0;padding:0;text-align:left;color:var(--blue)}
.target{font-size:12.5px;color:var(--muted);display:flex;flex-wrap:wrap;gap:4px 10px}
.target b{color:var(--fg)}
.sets{width:100%;border-collapse:separate;border-spacing:0 4px}
.sets th{font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;text-align:center;padding:0 2px}
.sets td{text-align:center;padding:0 2px;vertical-align:middle}
.sets td.n{font-weight:800;width:30px}
.sets td.prev{color:var(--muted);font-size:13px;width:74px}
.sets td.prev button{border:0;background:none;color:inherit;padding:4px;font-variant-numeric:tabular-nums}
.sets input{width:100%;max-width:78px;text-align:center;background:var(--surface2);border:1px solid transparent;border-radius:9px;height:38px;font-weight:700;font-variant-numeric:tabular-nums;font-size:16px}
.sets input:focus{outline:0;border-color:var(--blue)}
.sets tr.done td{background:var(--green-soft)}
.sets tr.done td:first-child{border-radius:9px 0 0 9px}.sets tr.done td:last-child{border-radius:0 9px 9px 0}
.sets tr.done input{background:transparent}
.ck{width:38px;height:38px;border-radius:9px;border:0;background:var(--surface2);display:grid;place-items:center;margin:0 auto}
.ck.on{background:var(--green);color:#fff}
.hint{font-size:12px;text-align:left;padding:0 4px 4px 34px;color:var(--muted)}
.hint b{color:var(--red)}
.hint.got b{color:var(--green)}
.rest{position:fixed;left:0;right:0;bottom:0;z-index:60;display:flex;justify-content:center;pointer-events:none}
.rest-in{pointer-events:auto;width:100%;max-width:760px;background:var(--fg);color:var(--bg);border-radius:18px 18px 0 0;padding-block:12px calc(12px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;align-items:center;gap:10px}
.rest-in .t{font-family:var(--display);font-size:34px;font-weight:900;font-variant-numeric:tabular-nums;min-width:86px}
.rest-in .prog{flex:1;height:6px;border-radius:3px;background:#8884;overflow:hidden}
.rest-in .prog i{display:block;height:100%;background:var(--yellow)}
.rest-in button{background:#8883;border:0;color:inherit;border-radius:9px;padding:8px 10px;font-weight:700}
.prflash{animation:prf 1.1s ease}
@keyframes prf{0%{box-shadow:0 0 0 0 var(--red)}40%{box-shadow:0 0 0 6px var(--red-soft)}100%{box-shadow:0 0 0 0 transparent}}
@media (prefers-reduced-motion:reduce){.prflash{animation:none}}

/* bottom nav & live bar */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:40;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
nav.tabs .in{max-width:760px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr)}
nav.tabs button{border:0;background:none;padding:9px 0 10px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11.5px;font-weight:700;color:var(--muted)}
nav.tabs button.on{color:var(--fg)}
nav.tabs button.on svg{stroke:var(--blue)}
.livebar{position:fixed;left:0;right:0;bottom:calc(58px + env(safe-area-inset-bottom,0px));z-index:39;display:flex;justify-content:center;padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px))}
.livebar button{width:100%;max-width:736px;border:0;border-radius:14px;background:var(--blue);color:var(--blue-ink);padding:11px 14px;display:flex;align-items:center;justify-content:space-between;font-weight:700;box-shadow:var(--shadow)}
.empty{border:1.5px dashed var(--line);border-radius:14px;padding:22px 16px;text-align:center;color:var(--muted);display:flex;flex-direction:column;gap:10px;align-items:center}
.toast{position:fixed;left:50%;top:calc(14px + env(safe-area-inset-top,0px));transform:translateX(-50%);z-index:90;background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:700;box-shadow:var(--shadow);max-width:calc(100% - 32px)}
.toast.pr{background:var(--red);color:#fff}
.field{display:flex;flex-direction:column;gap:6px}
.field input{background:var(--surface);border:1px solid var(--line);border-radius:10px;height:46px;padding:0 12px;font-size:16px}
.tpl-row{display:grid;grid-template-columns:60px 1fr auto;gap:10px;align-items:center}
.repin{margin-top:6px;width:100%;max-width:240px;background:var(--surface2);border:1px solid transparent;border-radius:8px;height:32px;padding:0 9px;font-size:14px}
.repin:focus{outline:0;border-color:var(--blue)}
.stepper{display:flex;align-items:center;gap:4px}
.stepper button{width:30px;height:30px;border-radius:8px;border:0;background:var(--surface2);font-weight:800}
.hist-day{display:flex;flex-direction:column;gap:6px}
.lines{font-size:13px;color:var(--muted);display:flex;flex-direction:column;gap:2px}
.lines b{color:var(--fg);font-weight:600}
@media (max-width:480px){.sync{display:none}}
@media (max-width:420px){h1{font-size:34px}.bar{grid-template-columns:90px 1fr 24px}.sets td.prev{width:58px;font-size:12px}}
</style>

    <div class="brand"><span class="plate-mark" aria-hidden="true"><i></i><i></i><i></i><i></i></span>Železný denník</div>

  </header>

</div>

<script>
"use strict";
/* ---------- slovník ---------- */
const MUS={abdominals:"Brucho",abductors:"Abduktory",adductors:"Adduktory",biceps:"Biceps",calves:"Lýtka",chest:"Hrudník",forearms:"Predlaktia",glutes:"Sedacie svaly",hamstrings:"Hamstringy",lats:"Široký chrbát",'lower back':"Spodný chrbát",'middle back':"Stred chrbta",neck:"Krk",quadriceps:"Stehná",shoulders:"Ramená",traps:"Trapézy",triceps:"Triceps"};
const EQ={barbell:"Veľká činka",dumbbell:"Jednoručky",cable:"Kladka",machine:"Stroj",'body only':"Vlastná váha",kettlebells:"Kettlebell",bands:"Odporové gumy",'medicine ball':"Medicinbal",'exercise ball':"Fitlopta",'foam roll':"Valec",'e-z curl bar':"EZ tyč",other:"Iné"};

/* ---------- PR výpočty ---------- */
const real=()=>S.sessions.filter(s=>!s.imported);
const imported=()=>S.sessions.filter(s=>s.imported);
let PR={};
function rebuild(){PR={};
  const ordered=[...S.sessions].sort((a,b)=>a.end-b.end);
  for(const s of ordered){for(const ex of s.ex){const p=PR[ex.id]||(PR[ex.id]={maxW:0,maxWr:0,e1:0,e1w:0,e1r:0,reps:0,vol:0,volw:0,volr:0,byReps:{},hist:[],lastSets:null,lastEnd:0});
    let best=0,top=null,svol=0;
    for(const st of ex.sets){const w=+st.w||0,r=+st.r||0;if(!r)continue;const e=e1(w,r);svol+=w*r;
      if(w>p.maxW||(w===p.maxW&&r>p.maxWr)){p.maxW=w;p.maxWr=r}
      if(e>p.e1){p.e1=e;p.e1w=w;p.e1r=r}
      if(r>p.reps)p.reps=r;
      if(w*r>p.vol){p.vol=w*r;p.volw=w;p.volr=r}
      if(!(p.byReps[r]>=w))p.byReps[r]=w;
      if(e>best){best=e;top=[w,r]}}
    p.hist.push({t:s.end,e1:best,top,vol:svol,sets:ex.sets,sid:s.id,imp:!!s.imported});if(!s.imported){p.lastSets=ex.sets;p.lastEnd=s.end}}}
}
function prsOfSession(s){const out=[];if(s.imported)return out;const before=S.sessions.filter(x=>x.end<s.end);
  for(const ex of s.ex){let bw=0,be=0;for(const o of before)for(const e of o.ex)if(e.id===ex.id)for(const st of e.sets){bw=Math.max(bw,+st.w);be=Math.max(be,e1(+st.w,+st.r))}
    let hit=null;for(const st of ex.sets){const e=e1(+st.w,+st.r);if(before.some(o=>o.ex.some(e2=>e2.id===ex.id))&&(e>be+1e-9||+st.w>bw)){hit=st;be=Math.max(be,e);bw=Math.max(bw,+st.w)}}
    if(hit)out.push({id:ex.id,w:+hit.w,r:+hit.r})}
  return out}

  const nxt=nextProgTpl();const tpls=(nxt?[nxt,...S.templates.filter(t=>t!==nxt)]:S.templates).slice(0,3);
  v.innerHTML=`

function filterEx(f){const q=f.q.trim().toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"");
  let r=EX.filter(x=>(!f.m||x.p.includes(f.m))&&(!f.eq||x.e===f.eq)&&(!f.cat||x.c===f.cat)&&(!f.mine||PR[x.id]));
  if(q){const words=q.split(/\s+/);r=r.filter(x=>{const h=x._h;return words.every(w=>h.includes(w))});
    r.sort((a,b)=>(b._h.startsWith(q)-a._h.startsWith(q))||(!!SK[b.id]-!!SK[a.id]))}
  else r.sort((a,b)=>(!!PR[b.id]-!!PR[a.id])||(!!SK[b.id]-!!SK[a.id])||a.n.localeCompare(b.n));
  return r}
function libControls(f){return `

  <div class="grid" id="lg"></div><div id="lsent" style="height:40px"></div>`}
function bindLib(root,f,onPick,selected,persist){
  let list=[],shown=0;
  const card=x=>{const p=PR[x.id];return `<button class="excard ${selected&&selected.has(x.id)?"sel":""}" data-id="${esc(x.id)}"><span class="ph" style="${thStyle(x.id)}"></span>${p?`<span class="pill pr prtag num">PR ${kg(p.maxW)}</span>`:""}${selected&&selected.has(x.id)?`<span class="tick">✓</span>`:""}<span class="tx"><span class="nm">${esc(x.n)}</span><span class="mu">${esc(SK[x.id]?SK[x.id]+" · ":"")}${x.p.map(m=>MUS[m]||m).join(", ")}</span></span></button>`};
  const more=()=>{const g=root.querySelector("#lg");if(!g)return;const chunk=list.slice(shown,shown+48);shown+=chunk.length;g.insertAdjacentHTML("beforeend",chunk.map(card).join(""));hydrateThumbs(g)};
  const apply=()=>{if(persist)try{localStorage.setItem("zd-lf",JSON.stringify(f))}catch(e){}list=filterEx(f);shown=0;root.querySelector("#lg").innerHTML=list.length?"":`<div class="empty" style="grid-column:1/-1">Nič sa nenašlo. Skús iné slovo alebo zruš filter.</div>`;root.querySelector("#lcount").textContent=list.length+" cvikov";more()};
  root.querySelector("#lq").oninput=e=>{f.q=e.target.value;apply()};
  root.querySelectorAll("#lm .chip").forEach(c=>c.onclick=()=>{f.m=c.dataset.m;root.querySelectorAll("#lm .chip").forEach(x=>x.classList.toggle("on",x===c));apply()});
  root.querySelector("#leq").onchange=e=>{f.eq=e.target.value;apply()};
  root.querySelector("#lc").onchange=e=>{f.cat=e.target.value;apply()};
  root.querySelector("#lmine").onclick=e=>{f.mine=!f.mine;e.currentTarget.classList.toggle("on",f.mine);apply()};
  root.querySelector("#lg").addEventListener("click",e=>{const b=e.target.closest(".excard");if(!b)return;onPick(b.dataset.id,b)});
  const io=new IntersectionObserver(es=>{if(es.some(x=>x.isIntersecting)&&shown<list.length)more()},{root:root.closest(".sheet")||null,rootMargin:"600px"});
  io.observe(root.querySelector("#lsent"));apply();return {redraw:apply}}
function vLib(v){v.innerHTML=`<div class="hero"><div><div class="eyebrow">${EX.length} cvikov s ukážkou</div><h1>Cviky</h1></div><button class="btn ghost sm" data-imp>${I.trophy}Importovať PR</button></div><div class="section" id="lib">${libControls(LF)}</div>`;

function pickExercises(cb,opt){opt=opt||{};const f={q:"",m:opt.m||"",eq:"",cat:"",mine:false};const sel=new Set();

function startAnims(root){root.querySelectorAll("[data-anim]").forEach(a=>{if(a._t)return;const lbl=a.querySelector(".lbl");
  const reduce=matchMedia("(prefers-reduced-motion: reduce)").matches;let s=false;

  a._t=setInterval(tick,reduce?2200:1100);a.onclick=tick})}
function chartSVG(h){if(h.length<2)return `<div class="empty" style="padding:16px">Graf sa ukáže po dvoch tréningoch tohto cviku.</div>`;
  const pts=h.slice(-24);const W=640,H=200,L=44,R=14,T=14,B=28;
  const ys=pts.map(p=>p.e1);let lo=Math.min(...ys),hi=Math.max(...ys);if(hi-lo<5){lo-=2.5;hi+=2.5}const pad=(hi-lo)*.12;lo=Math.max(0,lo-pad);hi+=pad;
  const step=(()=>{const r=(hi-lo)/4;const m=Math.pow(10,Math.floor(Math.log10(r)));for(const k of[1,2,2.5,5,10])if(k*m>=r)return k*m;return 10*m})();
  lo=Math.floor(lo/step)*step;hi=Math.ceil(hi/step)*step;
  const x=i=>L+(W-L-R)*(pts.length===1?.5:i/(pts.length-1)),y=v=>T+(H-T-B)*(1-(v-lo)/(hi-lo));
  let grid="";for(let v=lo;v<=hi+1e-9;v+=step)grid+=`<line x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)" stroke-width="1"/><text x="${L-8}" y="${y(v)+4}" text-anchor="end" font-size="11" fill="var(--muted)">${fmt(v)}</text>`;
  const line=pts.map((p,i)=>`${i?"L":"M"}${x(i).toFixed(1)},${y(p.e1).toFixed(1)}`).join("");
  const area=line+`L${x(pts.length-1)},${H-B}L${x(0)},${H-B}Z`;
  let best=-1,bi=0;pts.forEach((p,i)=>{if(p.e1>best){best=p.e1;bi=i}});
  const d0=new Date(pts[0].t).toLocaleDateString("sk-SK",{day:"numeric",month:"numeric"}),d1=new Date(pts[pts.length-1].t).toLocaleDateString("sk-SK",{day:"numeric",month:"numeric"});
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Vývoj odhadovaného maxima"><defs><linearGradient id="ga" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="var(--blue)" stop-opacity=".28"/><stop offset="1" stop-color="var(--blue)" stop-opacity="0"/></linearGradient></defs>${grid}
   <path d="${area}" fill="url(#ga)"/><path d="${line}" fill="none" stroke="var(--blue)" stroke-width="2.5" stroke-linejoin="round"/>
   ${pts.map((p,i)=>`<circle cx="${x(i)}" cy="${y(p.e1)}" r="${i===bi?5.5:3}" fill="${i===bi?"var(--red)":"var(--blue)"}" stroke="var(--surface)" stroke-width="1.5"/>`).join("")}
   <text x="${L}" y="${H-8}" font-size="11" fill="var(--muted)">${d0}</text><text x="${W-R}" y="${H-8}" font-size="11" text-anchor="end" fill="var(--muted)">${d1}</text></svg>`}
function openExercise(id,fromWorkout){const x=EXM[id];if(!x)return;
  const o=pushLayer(`<div class="sheet full"><div id="exd"></div></div>`);
  const draw=()=>{const p=PR[id];o.querySelector("#exd").innerHTML=`

/* ---------- AKTÍVNY TRÉNING ---------- */
function newSets(id,n){const last=PR[id]&&PR[id].lastSets;return Array.from({length:n},(_,i)=>{const l=last&&(last[i]||last[last.length-1]);return {w:"",r:"",done:false,pw:l?l.w:"",pr:l?l.r:""}})}
function startWorkout(t){if(S.active){openWorkout();return}
  S.active={id:uid(),name:t?t.name:"Tréning "+new Date().toLocaleDateString("sk-SK",{day:"numeric",month:"numeric"}),tpl:t?t.id:null,start:Date.now(),
   ex:t?t.ex.map(e=>({id:e.id,reps:e.reps||"",rest:defRest(e.id),sets:newSets(e.id,e.sets)})):[]};
  saveActive(true);openWorkout();render();if(!t)setTimeout(()=>pickExercises(addExToActive),50)}
function defRest(id){const x=EXM[id];if(!x)return 90;return x.m==="compound"&&["barbell"].includes(x.e)?150:x.m==="compound"?120:75}
function addExToActive(ids){if(!S.active)return;ids.forEach(id=>S.active.ex.push({id,rest:defRest(id),sets:newSets(id,3)}));saveActive(true);const w=$("#wo");if(w)w._re();render()}
function renderLive(){const lb=$("#livebar");if(!S.active||$("#wo")){lb.hidden=true;return}lb.hidden=false;
  const done=S.active.ex.reduce((a,e)=>a+e.sets.filter(s=>s.done).length,0),all=S.active.ex.reduce((a,e)=>a+e.sets.length,0);
  lb.innerHTML=`<button><span>${esc(S.active.name)} · <span class="num">${done}/${all}</span> sérií</span><span class="num" id="lbclock">${clockTxt()}</span></button>`;lb.querySelector("button").onclick=openWorkout}
const clockTxt=()=>{if(!S.active)return"";const s=Math.floor((Date.now()-S.active.start)/1000);const h=Math.floor(s/3600),m=Math.floor(s/60)%60,ss=s%60;return(h?h+":":"")+String(m).padStart(h?2:1,"0")+":"+String(ss).padStart(2,"0")};
setInterval(()=>{const c=$("#lbclock");if(c)c.textContent=clockTxt();const w=$("#woclock");if(w)w.textContent=clockTxt()},1000);

/* Do PR chýba: pre danú váhu koľko opakovaní, pre dané opakovania akú váhu */
function bestBefore(id,exIdx,setIdx){const p=PR[id];let maxW=p?p.maxW:0,E=p?p.e1:0,hasHist=!!p;
  const ex=S.active.ex[exIdx];ex.sets.forEach((s,i)=>{if(s.done&&i!==setIdx){const w=num(s.w),r=num(s.r);if(r>0){maxW=Math.max(maxW,w);E=Math.max(E,e1(w,r));}}});
  return {maxW,E,hasHist}}
function hintFor(id,exIdx,setIdx){const s=S.active.ex[exIdx].sets[setIdx];const b=bestBefore(id,exIdx,setIdx);if(!b.hasHist||!b.E)return"";
  const w=num(s.w),r=num(s.r);
  if(s.done){if(s.isPR)return `<div class="hint got">🏆 <b>Nový rekord!</b> ${s.isPR}</div>`;return""}
  if(w>0&&r>0&&(e1(w,r)>b.E+1e-9||w>b.maxW))return `<div class="hint got"><b>Toto bude PR</b> — odhad 1RM ${k1(e1(w,r))}</div>`;
  if(w>0){if(w>b.maxW)return `<div class="hint got"><b>Najťažšia váha v histórii</b> — stačí 1 opakovanie</div>`;
    const need=w>=b.E?1:Math.floor(30*(b.E/w-1))+1;if(need>30)return `<div class="hint">Pri ${kg(w)} je PR mimo dosahu — pridaj váhu.</div>`;
    return `<div class="hint">Do PR pri ${kg(w)}: <b>${need} opak.</b>${b.maxW-w>0?` · k max. váhe chýba <b>${kg(b.maxW-w)}</b>`:""}</div>`}
  if(r>0){const nw=Math.ceil((b.E/(r===1?1:1+r/30))/1.25+1e-9)*1.25;return `<div class="hint">Do PR pri ${r} opak.: <b>${kg(nw)}</b></div>`}
  return ""}
function openWorkout(){if(!S.active)return;if($("#wo"))return;
  const o=pushLayer(`<div class="sheet full" id="wo"></div>`);const wo=o.querySelector("#wo");
  const draw=()=>{const A=S.active;if(!A){popLayer();return}
   const done=A.ex.reduce((a,e)=>a+e.sets.filter(s=>s.done).length,0);
   const vol=A.ex.reduce((a,e)=>a+e.sets.filter(s=>s.done).reduce((b,s)=>b+num(s.w)*num(s.r),0),0);
   wo.innerHTML=`<div class="sheet-head"><button class="icon-btn" data-a="min" aria-label="Minimalizovať">${I.min}</button><span class="clock" id="woclock">${clockTxt()}</span><button class="btn primary sm" data-a="fin">Dokončiť</button></div>
   <div class="stack">
    <div class="wo-head"><input id="woname" value="${esc(A.name)}" aria-label="Názov tréningu" style="font-family:var(--display);font-weight:900;font-size:32px;text-transform:uppercase;border:0;background:transparent;padding:0;width:100%;min-width:0"><div class="row muted num" style="gap:14px;font-size:13px"><span>${done} ${pl(done,"séria hotová","série hotové","sérií hotových")}</span><span>objem ${big(vol)}</span></div></div>
    ${A.ex.map((e,ei)=>exBlock(e,ei)).join("")}

   return `<div class="wx" data-ei="${ei}">
    <div class="wx-top"><div class="anim" data-anim="${esc(e.id)}" style="border-radius:11px;width:64px"><span class="a" style="${frStyle(e.id,0)}"></span><span class="b" style="${frStyle(e.id,1)}"></span></div>
     <div style="min-width:0"><button class="wx-name" data-info="${esc(e.id)}">${esc(exName(e.id))}</button>
      <div class="target">${e.reps?`<span>cieľ <b>${esc(e.reps)} opak.</b></span>`:""}${p?`<span>PR <b class="num">${kg(p.maxW)}×${p.maxWr}</b></span><span>1RM <b class="num">${k1(p.e1)}</b></span>`:`<span>Prvýkrát — nastavíš základ</span>`}<span>pauza <b class="num">${Math.floor(e.rest/60)}:${String(e.rest%60).padStart(2,"0")}</b></span></div></div>
     <button class="icon-btn" data-exmenu="${ei}" aria-label="Možnosti cviku">${I.dots}</button></div>
    <table class="sets"><thead><tr><th>#</th><th>Minule</th><th>kg</th><th>Opak.</th><th><span style="position:absolute;left:-9999px">Hotovo</span>✓</th></tr></thead><tbody>
    ${e.sets.map((s,si)=>`<tr class="${s.done?"done":""}" data-si="${si}"><td class="n">${si+1}</td>
      <td class="prev">${s.pw!==""&&s.pw!=null?`<button data-fill="${si}" class="num" aria-label="Použiť minulú hodnotu">${fmt(+s.pw)}×${s.pr}</button>`:"—"}</td>
      <td><input inputmode="decimal" data-w="${si}" value="${esc(s.w)}" placeholder="${s.pw!==""&&s.pw!=null?esc(fmt(+s.pw)):"0"}" aria-label="Váha série ${si+1}"></td>
      <td><input inputmode="numeric" data-r="${si}" value="${esc(s.r)}" placeholder="${s.pr!==""&&s.pr!=null?esc(s.pr):"0"}" aria-label="Opakovania série ${si+1}"></td>
      <td><button class="ck ${s.done?"on":""}" data-done="${si}" aria-label="Séria ${si+1} hotová" aria-pressed="${s.done}">${I.check}</button></td></tr>
      <tr><td colspan="5" data-hint="${si}">${hintFor(e.id,ei,si)}</td></tr>`).join("")}
    </tbody></table>
    <div class="row"><button class="btn sm ghost" data-addset="${ei}">${I.plus}Séria</button>${e.sets.length>1?`<button class="btn sm ghost" data-rmset="${ei}">Odobrať sériu</button>`:""}</div></div>`};
  const bind=()=>{const A=S.active;const q=s=>wo.querySelector(s);
   q("#woname").oninput=ev=>{A.name=ev.target.value;saveActive()};
   q("[data-a=min]").onclick=()=>{popLayer();render()};
   q("[data-a=add]").onclick=()=>pickExercises(addExToActive);
   q("[data-a=cancel]").onclick=async()=>{if(await confirmBox("Zrušiť tréning?","Zapísané série sa neuložia.","Zrušiť tréning",true)){S.active=null;stopRest();saveActive(true);popLayer();render()}};
   q("[data-a=fin]").onclick=finishWorkout;
   wo.querySelectorAll(".wx").forEach(box=>{const ei=+box.dataset.ei;const e=A.ex[ei];
    box.querySelector("[data-info]").onclick=()=>openExercise(e.id,true);
    box.querySelector("[data-exmenu]").onclick=()=>exMenu(ei);
    box.querySelectorAll("[data-fill]").forEach(b=>b.onclick=()=>{const s=e.sets[+b.dataset.fill];s.w=String(s.pw);s.r=String(s.pr);saveActive();draw()});
    box.querySelectorAll("[data-w],[data-r]").forEach(inp=>inp.oninput=()=>{const si=+(inp.dataset.w??inp.dataset.r);const s=e.sets[si];if(inp.dataset.w!=null)s.w=inp.value.replace(",",".");else s.r=inp.value.replace(/\D/g,"");
      box.querySelector(`[data-hint="${si}"]`).innerHTML=hintFor(e.id,ei,si);saveActive()});
    box.querySelectorAll("[data-done]").forEach(b=>b.onclick=()=>toggleSet(ei,+b.dataset.done,b));
    box.querySelector("[data-addset]").onclick=()=>{const l=e.sets[e.sets.length-1];e.sets.push({w:l?l.w:"",r:l?l.r:"",done:false,pw:"",pr:""});saveActive();draw()};
    const rm=box.querySelector("[data-rmset]");if(rm)rm.onclick=()=>{e.sets.pop();saveActive();draw()};
   })};
  function toggleSet(ei,si,btn){const e=S.active.ex[ei],s=e.sets[si];
   if(!s.done){if(s.w===""&&s.pw!=="")s.w=String(s.pw);if(s.r===""&&s.pr!=="")s.r=String(s.pr);
     const w=num(s.w),r=num(s.r);if(!(r>0)||!(w>=0)){toast("Zadaj váhu a počet opakovaní.");return}
     const b=bestBefore(e.id,ei,si);s.done=true;s.isPR="";
     if(b.hasHist&&(e1(w,r)>b.E+1e-9||w>b.maxW)){s.isPR=w>b.maxW?`najťažšia váha ${kg(w)}`:`odhad 1RM ${k1(e1(w,r))}`;toast("Nový osobný rekord! "+exName(e.id)+" "+kg(w)+" × "+r,true)}
     startRest(e.rest)}else{s.done=false;s.isPR=""}
   saveActive();draw();if(s.isPR){const row=wo.querySelector(`.wx[data-ei="${ei}"] tr[data-si="${si}"]`);row&&row.querySelectorAll("td").forEach(td=>td.classList.add("prflash"))}}
  function exMenu(ei){const e=S.active.ex[ei];const m=pushLayer(`<div class="sheet"><div class="stack" style="padding-top:18px"><h2>${esc(exName(e.id))}</h2>
    <div class="row between card"><span>Pauza medzi sériami</span><div class="stepper"><button data-r="-15" aria-label="Kratšia pauza">−</button><b class="num" id="rv" style="min-width:44px;text-align:center">${Math.floor(e.rest/60)}:${String(e.rest%60).padStart(2,"0")}</b><button data-r="15" aria-label="Dlhšia pauza">+</button></div></div>
    <div class="row"><button class="btn ghost block" data-mv="-1" ${ei?"":"disabled"}>${I.up}Vyššie</button><button class="btn ghost block" data-mv="1" ${ei<S.active.ex.length-1?"":"disabled"}>${I.down}Nižšie</button></div>

   m.querySelectorAll("[data-r]").forEach(b=>b.onclick=()=>{e.rest=Math.max(15,Math.min(600,e.rest+ +b.dataset.r));m.querySelector("#rv").textContent=Math.floor(e.rest/60)+":"+String(e.rest%60).padStart(2,"0");saveActive()});
   m.querySelectorAll("[data-mv]").forEach(b=>b.onclick=()=>{const j=ei+ +b.dataset.mv;[S.active.ex[ei],S.active.ex[j]]=[S.active.ex[j],S.active.ex[ei]];saveActive();popLayer();draw()});
   m.querySelector("[data-rm]").onclick=()=>{S.active.ex.splice(ei,1);saveActive();popLayer();draw()};
   m.querySelector("[data-swap]").onclick=()=>{popLayer();const x=EXM[e.id];pickExercises(([nid])=>{const done=e.sets.filter(s=>s.done).length;
     if(done)S.active.ex.splice(ei+1,0,{id:nid,reps:e.reps||"",rest:defRest(nid),sets:newSets(nid,Math.max(1,e.sets.length-done))}),e.sets=e.sets.filter(s=>s.done);

     saveActive(true);draw();toast("Cvik vymenený")},{swap:e.id,m:x&&x.p[0]})};

/* odpočet pauzy */
let restEnd=0,restTot=0,restI=null,wake=null;
function startRest(sec){restTot=sec;restEnd=Date.now()+sec*1000;$("#rest").hidden=false;tickRest();clearInterval(restI);restI=setInterval(tickRest,250);
  try{navigator.wakeLock&&navigator.wakeLock.request("screen").then(w=>wake=w).catch(()=>{})}catch(e){}}
function stopRest(){clearInterval(restI);$("#rest").hidden=true;try{wake&&wake.release()}catch(e){}wake=null}
function tickRest(){$("#rest").hidden=!$("#wo");const left=Math.max(0,Math.ceil((restEnd-Date.now())/1000));
  if(left<=0){stopRest();toast("Pauza skončila — ďalšia séria!");try{navigator.vibrate&&navigator.vibrate([200,100,200])}catch(e){}return}
  $("#rest").innerHTML=`<div class="rest-in"><span class="t">${Math.floor(left/60)}:${String(left%60).padStart(2,"0")}</span><div class="prog"><i style="width:${(1-left/restTot)*100}%"></i></div><button data-d="-15">−15</button><button data-d="15">+15</button><button data-d="0">Preskočiť</button></div>`;
  $("#rest").querySelectorAll("button").forEach(b=>b.onclick=()=>{const d=+b.dataset.d;if(!d){stopRest();return}restEnd+=d*1000;restTot=Math.max(1,restTot+d);tickRest()})}

async function finishWorkout(){const A=S.active;
  const ex=A.ex.map(e=>({id:e.id,sets:e.sets.filter(s=>s.done&&num(s.r)>0).map(s=>({w:num(s.w)||0,r:num(s.r)}))})).filter(e=>e.sets.length);
  if(!ex.length){if(await confirmBox("Žiadna hotová séria","Odškrtni aspoň jednu sériu, alebo tréning zruš.","Zrušiť tréning",true)){S.active=null;saveActive(true);stopRest();popLayer();render()}return}
  const pending=A.ex.reduce((a,e)=>a+e.sets.filter(s=>!s.done).length,0);
  if(pending&&!(await confirmBox("Dokončiť tréning?",`Ostáva ${pending} neodškrtnutých sérií. Tie sa neuložia.`,"Dokončiť")))return;
  const s={id:A.id,name:A.name.trim()||"Tréning",tpl:A.tpl,start:A.start,end:Date.now(),ex};
  S.sessions.unshift(s);S.active=null;stopRest();rebuild();saveSession(s);saveActive(true);
  if(A.tpl){const t=S.templates.find(x=>x.id===A.tpl);if(t){const ids=ex.map(e=>e.id);const changed=ids.join()!==t.ex.map(e=>e.id).join();if(changed){/* ponúkne sa v súhrne */s._tplChanged=true}}}
  popLayer();render();summary(s)}
function summary(s){const prs=prsOfSession(s);const vol=s.ex.reduce((a,e)=>a+e.sets.reduce((b,x)=>b+x.w*x.r,0),0);const n=s.ex.reduce((a,e)=>a+e.sets.length,0);
  const o=pushLayer(`<div class="sheet"><div class="stack" style="padding-top:20px">
   <div class="eyebrow">Tréning dokončený</div><h1>${esc(s.name)}</h1>
   <div class="stats"><div class="stat"><b>${dur(s.end-s.start).replace(" min","")}</b><span>${s.end-s.start>=3600000?"trvanie":"minút"}</span></div><div class="stat"><b>${big(vol).replace(/ (kg|t)$/,"")}</b><span>${vol>=10000?"ton":"kg"} objemu</span></div><div class="stat"><b>${n}</b><span>sérií</span></div></div>
   ${prs.length?`<div class="card" style="border-color:var(--red)"><div class="row" style="gap:8px;color:var(--red);font-weight:800">${I.trophy} ${prs.length} ${prs.length===1?"nový rekord":prs.length<5?"nové rekordy":"nových rekordov"}</div><div class="lines" style="margin-top:6px">${prs.map(p=>`<span><b>${esc(exName(p.id))}</b> — ${kg(p.w)} × ${p.r}</span>`).join("")}</div></div>`:""}
   ${s.tpl&&s._tplChanged?`<button class="btn ghost block" data-upd>Uložiť zmeny cvikov do rutiny</button>`:""}
   ${!s.tpl?`<button class="btn ghost block" data-mk>Uložiť ako novú rutinu</button>`:""}
   <button class="btn primary block" data-ok>Super</button></div></div>`);
  o.querySelector("[data-ok]").onclick=()=>popLayer();
  const u=o.querySelector("[data-upd]");if(u)u.onclick=()=>{const t=S.templates.find(x=>x.id===s.tpl);const old=t.ex;t.ex=s.ex.map(e=>({id:e.id,sets:e.sets.length,reps:(old.find(o=>o.id===e.id)||{}).reps||""}));saveTemplates();u.disabled=true;u.textContent="Rutina aktualizovaná"};
  const mk=o.querySelector("[data-mk]");if(mk)mk.onclick=()=>{S.templates.push({id:uid(),name:s.name,ex:s.ex.map(e=>({id:e.id,sets:e.sets.length}))});saveTemplates();mk.disabled=true;mk.textContent="Uložené medzi tréningy"}}

/* ---------- IMPORT REKORDOV ---------- */
const IMPORT_PREFILL=[["Barbell_Squat",120,1],["Barbell_Bench_Press_-_Medium_Grip",120,3],["Leg_Press",332,1]];
const isoDay=t=>{const d=new Date(t);return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")};
function openImport(forId){
  const today=isoDay(Date.now()-864e5);
  let rows=forId?[{id:forId,w:"",r:"1",d:today}]:(!imported().length?IMPORT_PREFILL.map(([id,w,r])=>({id,w:String(w),r:String(r),d:today})):[{id:"",w:"",r:"1",d:today}]);
  const o=pushLayer(`<div class="sheet full"><div id="imp"></div></div>`);
  const draw=()=>{const ex=imported();o.querySelector("#imp").innerHTML=`
   <div class="sheet-head"><button class="icon-btn" data-x aria-label="Zavrieť">${I.x}</button><h2>Rekordy z inej appky</h2><button class="btn primary sm" data-save>Uložiť</button></div>
   <div class="stack"><div class="muted" style="font-size:13.5px;max-width:65ch">Zadaj váhu a počet opakovaní, ktoré si zvládol, napríklad 120 kg × 3. Rekordy sa započítajú do PR a odhadu 1RM, ale neobjavia sa v histórii ani v týždenných štatistikách.</div>
   ${rows.map((r,i)=>`<div class="card stack" style="gap:10px"><div class="row between"><button class="wx-name" data-pick="${i}">${r.id?esc(exName(r.id)):"Vybrať cvik…"}</button><button class="icon-btn" data-rm="${i}" aria-label="Odstrániť riadok">${I.trash}</button></div>
     ${r.id&&exSK(r.id)?`<div class="muted" style="font-size:12.5px;margin-top:-8px">${esc(exSK(r.id))}</div>`:""}
     <div class="row" style="gap:8px"><label class="field" style="flex:1;min-width:0"><span class="eyebrow">kg</span><input id="iw${i}" inputmode="decimal" data-f="w" data-i="${i}" value="${esc(r.w)}" placeholder="0"></label>
     <label class="field" style="flex:1;min-width:0"><span class="eyebrow">Opakovania</span><input id="ir${i}" inputmode="numeric" data-f="r" data-i="${i}" value="${esc(r.r)}" placeholder="1"></label>
     <label class="field" style="flex:1.4;min-width:0"><span class="eyebrow">Dátum</span><input id="id${i}" type="date" data-f="d" data-i="${i}" value="${esc(r.d)}"></label></div>
     <div class="muted num" style="font-size:12.5px" data-e1="${i}"></div></div>`).join("")}
   <button class="btn ghost block" data-add>${I.plus}Pridať ďalší rekord</button>
   ${ex.length?`<div class="section"><h3>Už importované</h3><div class="list">${ex.sort((a,b)=>b.end-a.end).map(s=>s.ex.map(e=>`<div class="card prrow"><span class="thumb" style="${thStyle(e.id)}"></span><div style="min-width:0"><div style="font-weight:700">${esc(exName(e.id))}</div><div class="muted num" style="font-size:12.5px">${e.sets.map(x=>kg(x.w)+" × "+x.r).join(", ")} · ${dateSK(s.end)}</div></div><button class="icon-btn" data-del="${s.id}" aria-label="Zmazať import">${I.trash}</button></div>`).join("")).join("")}</div></div>`:""}
   </div>`;
   const q=s=>o.querySelector(s);
   const showE1=i=>{const r=rows[i],w=num(r.w),n=num(r.r);const el=o.querySelector(`[data-e1="${i}"]`);if(el)el.textContent=w>0&&n>0?`Odhad 1RM: ${k1(e1(w,n))}`:""};
   rows.forEach((_,i)=>showE1(i));
   q("[data-x]").onclick=()=>popLayer();
   q("[data-add]").onclick=()=>{rows.push({id:"",w:"",r:"1",d:today});draw()};
   o.querySelectorAll("[data-f]").forEach(inp=>inp.oninput=()=>{rows[+inp.dataset.i][inp.dataset.f]=inp.value.replace(",",".");showE1(+inp.dataset.i)});
   o.querySelectorAll("[data-rm]").forEach(b=>b.onclick=()=>{rows.splice(+b.dataset.rm,1);draw()});
   o.querySelectorAll("[data-pick]").forEach(b=>b.onclick=()=>pickExercises(ids=>{if(!ids.length)return;const i=+b.dataset.pick;rows[i].id=ids[0];ids.slice(1).forEach(id=>rows.push({id,w:"",r:"1",d:today}));draw()}));
   o.querySelectorAll("[data-del]").forEach(b=>b.onclick=async()=>{if(await confirmBox("Zmazať importovaný rekord?","Rekord sa prestane započítavať do PR.","Zmazať",true)){const sid=b.dataset.del;S.sessions=S.sessions.filter(x=>x.id!==sid);rebuild();del("s-"+sid);draw();render()}});
   q("[data-save]").onclick=()=>{const ok=rows.filter(r=>r.id&&num(r.w)>=0&&num(r.r)>0&&r.w!=="");
     if(!ok.length){toast("Vyber cvik a zadaj váhu aj opakovania.");return}
     if(ok.length<rows.filter(r=>r.id||r.w).length){toast("Niektorým riadkom chýba cvik, váha alebo opakovania.");return}
     ok.forEach(r=>{const t=r.d?new Date(r.d+"T12:00:00").getTime():Date.now()-864e5;const s={id:"imp-"+uid(),name:"Import",imported:true,start:t,end:t,ex:[{id:r.id,sets:[{w:num(r.w),r:num(r.r)}]}]};S.sessions.push(s);saveSession(s)});
     S.sessions.sort((a,b)=>b.end-a.end);rebuild();toast(ok.length===1?"Rekord uložený":`Uložených ${ok.length} rekordov`);popLayer();render();const tl=topLayer();if(tl&&tl._re)tl._re()};
  };o._re=draw;draw()}

/* ---------- ZÁLOHA ---------- */
function backupJSON(){return JSON.stringify({app:"zelezny-dennik",v:1,exported:Date.now(),sessions:S.sessions,templates:S.templates})}
function importBackup(txt){let d;try{d=JSON.parse(txt)}catch(e){toast("Toto nie je platná záloha.");return false}
  if(!d||d.app!=="zelezny-dennik"||!Array.isArray(d.sessions)){toast("Toto nie je záloha Železného denníka.");return false}
  const have=new Set(S.sessions.map(s=>s.id));let ns=0,nt=0;
  d.sessions.forEach(s=>{if(s&&s.id&&Array.isArray(s.ex)&&!have.has(s.id)){const c={...s};delete c.kind;S.sessions.push(c);saveSession(c);ns++}});
  const th=new Set(S.templates.map(t=>t.id));(d.templates||[]).forEach(t=>{if(t&&t.id&&!th.has(t.id)){S.templates.push(t);nt++}});
  if(nt)saveTemplates();S.sessions.sort((a,b)=>b.end-a.end);rebuild();render();
  toast(ns||nt?`Importované: ${ns} záznamov, ${nt} tréningov`:"Všetko z tejto zálohy už máš.");return true}
function openBackup(){const json=backupJSON();const canFile=!window.claude;
  const o=pushLayer(`<div class="sheet"><div class="sheet-head"><button class="icon-btn" data-x aria-label="Zavrieť">${I.x}</button><h2>Záloha dát</h2><span style="width:40px"></span></div>
   <div class="stack">
    <div class="card stack"><h3>Exportovať</h3><div class="muted" style="font-size:13px">${S.sessions.length} záznamov a ${S.templates.length} tréningov. ${canFile?"Ulož si súbor do telefónu alebo ho pošli sebe.":"Skopíruj text a vlož ho do novej appky cez Importovať."}</div>
     <div class="row wrap">${canFile?`<button class="btn primary" data-file>Uložiť súbor</button>`:""}<button class="btn ${canFile?"ghost":"primary"}" data-copy>Kopírovať zálohu</button></div>
     <textarea id="bkout" readonly rows="3" style="width:100%;font:12px ui-monospace,monospace;background:var(--surface2);color:var(--fg);border:0;border-radius:9px;padding:8px" aria-label="Text zálohy">${esc(json)}</textarea></div>
    <div class="card stack"><h3>Importovať</h3><div class="muted" style="font-size:13px">Vlož text zálohy alebo vyber súbor. Existujúce záznamy sa nezdvoja.</div>
     <textarea id="bkin" rows="3" placeholder="Sem vlož skopírovanú zálohu…" style="width:100%;font:12px ui-monospace,monospace;background:var(--surface2);color:var(--fg);border:0;border-radius:9px;padding:8px" aria-label="Vložiť zálohu"></textarea>
     <div class="row wrap"><button class="btn primary" data-imp>Importovať text</button><label class="btn ghost">Vybrať súbor<input type="file" id="bkfile" accept=".json,application/json,text/plain" hidden></label></div></div>
   </div></div>`);
  o.querySelector("[data-x]").onclick=()=>popLayer();
  o.querySelector("[data-copy]").onclick=()=>{const ta=o.querySelector("#bkout");try{navigator.clipboard.writeText(json).then(()=>toast("Záloha skopírovaná"),()=>{ta.select();toast("Označené — skopíruj ručne")})}catch(e){ta.select();toast("Označené — skopíruj ručne")}};
  const f=o.querySelector("[data-file]");if(f)f.onclick=async()=>{const name="zelezny-dennik-"+isoDay(Date.now())+".json";const file=new File([json],name,{type:"application/json"});
    try{if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file],title:"Záloha Železného denníka"});return}}catch(e){if(e&&e.name==="AbortError")return}
    const a=document.createElement("a");a.href=URL.createObjectURL(file);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1000)};
  o.querySelector("[data-imp]").onclick=()=>{const t=o.querySelector("#bkin").value.trim();if(!t){toast("Najprv vlož text zálohy.");return}if(importBackup(t))popLayer()};
  o.querySelector("#bkfile").onchange=e=>{const file=e.target.files[0];if(!file)return;const r=new FileReader();r.onload=()=>{if(importBackup(String(r.result)))popLayer()};r.readAsText(file)};
}

/* ---------- HISTÓRIA ---------- */
function vHist(v){
  const HS=real();
  if(!HS.length){v.innerHTML=`<div class="hero"><div><div class="eyebrow">Denník</div><h1>História</h1></div></div><div class="section"><div class="empty"><b style="color:var(--fg)">Zatiaľ prázdne</b>Dokončené tréningy sa uložia sem, aj s rekordmi.<button class="btn primary" id="hs">Začať tréning</button></div></div>`;v.querySelector("#hs").onclick=()=>{tab="plan";renderTabs();render()};return}
  const groups={};HS.forEach(s=>{const k=new Date(s.end).toLocaleDateString("sk-SK",{month:"long",year:"numeric"});(groups[k]=groups[k]||[]).push(s)});
  v.innerHTML=`<div class="hero"><div><div class="eyebrow">${HS.length} tréningov</div><h1>História</h1></div></div>`+Object.entries(groups).map(([k,arr])=>`<div class="section"><h2>${esc(k)}</h2><div class="list">${arr.map(s=>{const prs=prsOfSession(s);const vol=s.ex.reduce((a,e)=>a+e.sets.reduce((b,x)=>b+x.w*x.r,0),0);
    return `<button class="card hist-day" data-s="${s.id}" style="text-align:left"><div class="row between"><h3>${esc(s.name)}</h3>${prs.length?`<span class="pill pr">${prs.length} PR</span>`:""}</div>
    <div class="row muted num wrap" style="gap:12px;font-size:12.5px"><span>${dateSK(s.end)}</span><span>${dur(s.end-s.start)}</span><span>${big(vol)}</span></div>
    <div class="lines">${s.ex.slice(0,5).map(e=>{const t=e.sets.reduce((a,x)=>e1(x.w,x.r)>e1(a.w,a.r)?x:a,e.sets[0]);return `<span>${e.sets.length}× <b>${esc(exName(e.id))}</b> · ${fmt(t.w)} kg × ${t.r}</span>`}).join("")}${s.ex.length>5?`<span>+ ${s.ex.length-5} ďalšie</span>`:""}</div></button>`}).join("")}</div></div>`).join("");
  v.querySelectorAll("[data-s]").forEach(b=>b.onclick=()=>openSession(b.dataset.s))}
function openSession(id){const s=S.sessions.find(x=>x.id===id);if(!s)return;const prs=prsOfSession(s);
  const o=pushLayer(`<div class="sheet"><div class="sheet-head"><button class="icon-btn" data-x aria-label="Zavrieť">${I.x}</button><span class="eyebrow">${dateSK(s.end)} · ${dur(s.end-s.start)}</span><span style="width:40px"></span></div>
   <div class="stack"><h1 style="font-size:34px">${esc(s.name)}</h1>
   ${s.ex.map(e=>`<div class="card"><button class="wx-name" data-ex="${esc(e.id)}">${esc(exName(e.id))}</button><div class="lines num" style="margin-top:6px">${e.sets.map((x,i)=>{const isP=prs.some(p=>p.id===e.id&&p.w===x.w&&p.r===x.r);return `<span>${i+1}. <b>${fmt(x.w)} kg × ${x.r}</b>${isP?` <span class="pill pr">PR</span>`:""}</span>`}).join("")}</div></div>`).join("")}
   <button class="btn danger block" data-del>${I.trash}Zmazať tréning</button></div></div>`);
  o.querySelector("[data-x]").onclick=()=>popLayer();
  o.querySelectorAll("[data-ex]").forEach(b=>b.onclick=()=>openExercise(b.dataset.ex));
  o.querySelector("[data-del]").onclick=async()=>{if(await confirmBox("Zmazať tréning?","Tréning a jeho rekordy sa natrvalo odstránia.","Zmazať",true)){S.sessions=S.sessions.filter(x=>x.id!==id);rebuild();del("s-"+id);popLayer();render()}}}

/* ---------- štart ---------- */
(async function(){
  try{tab=localStorage.getItem("zd-tab")||"home";if(!TABS.some(t=>t[0]===tab))tab="home"}catch(e){}
  renderTabs();$("#view").innerHTML=`<div class="empty" style="margin-top:30px">Načítavam databázu cvikov…</div>`;
  const exP=fetch("media/exercises.json").then(r=>r.json());
  const stP=initStore();
  try{EX=await exP}catch(e){$("#view").innerHTML=`<div class="empty">Databázu cvikov sa nepodarilo načítať. Obnov stránku.</div>`;return}
  EX.forEach(x=>{EXM[x.id]=x;x._h=(x.n+" "+(SK[x.id]||"")+" "+x.p.map(m=>MUS[m]).join(" ")+" "+(EQ[x.e]||"")).toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"")});
  rebuild();render();
  await stP;rebuild();refresh();
})();
</script>

<script>
"use strict";
(function(){
  try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}
  /* zablokovanie zoomu ako v natívnej appke (pinch aj dvojité ťuknutie) */
  ["gesturestart","gesturechange","gestureend"].forEach(t=>document.addEventListener(t,e=>e.preventDefault(),{passive:false}));
  document.addEventListener("touchmove",e=>{if(e.touches&&e.touches.length>1)e.preventDefault()},{passive:false});
  if(!("serviceWorker" in navigator))return;
  let reloading=false;
  navigator.serviceWorker.addEventListener("controllerchange",()=>{if(reloading)return;reloading=true;location.reload()});
  function offer(w){if(document.getElementById("upd"))return;const d=document.createElement("div");d.className="upd";d.id="upd";d.setAttribute("role","status");
    d.innerHTML='<span>Je dostupná nová verzia</span><button type="button">Obnoviť</button>';
    d.querySelector("button").onclick=()=>{d.querySelector("button").textContent="Načítavam…";w.postMessage("SKIP_WAITING")};document.body.appendChild(d)}
  window.addEventListener("load",()=>{
    navigator.serviceWorker.register("sw.js").then(reg=>{
      if(reg.waiting&&navigator.serviceWorker.controller)offer(reg.waiting);
      reg.addEventListener("updatefound",()=>{const w=reg.installing;if(!w)return;w.addEventListener("statechange",()=>{if(w.state==="installed"&&navigator.serviceWorker.controller)offer(w)})});
      document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible")reg.update().catch(()=>{})});
    }).catch(()=>{});
  });
})();
</script>
</body>
